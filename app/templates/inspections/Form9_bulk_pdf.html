<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: "BankGothic";
    src: url("{{ url_for('static', filename='fonts/BankGothic.ttf', _external=True) }}");
  }
  @page { size: A4; margin: 18mm 16mm; }
  body { font-family: "Helvetica", Arial, sans-serif; font-size: 11px; color: #1a1a1a; }
  h1 { font-family: "BankGothic", Arial, sans-serif; font-size: 18px; text-align: center; margin: 0 0 2px; letter-spacing: 1px; }
  .subtitle { text-align: center; font-size: 12px; color: #555; margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
  td, th { border: 1px solid #ccc; padding: 5px 8px; text-align: left; vertical-align: top; }
  th { background: #f2f4f7; width: 34%; font-weight: 600; }
  .section-title { font-weight: 700; font-size: 12.5px; margin: 14px 0 6px; border-bottom: 1.5px solid #333; padding-bottom: 3px; }
  .findings-table td:first-child { width: 60%; }
  .cert-block { margin-top: 22px; }
  .signature-line { margin-top: 40px; border-top: 1px solid #333; width: 220px; padding-top: 4px; font-size: 10.5px; }
  .cert-page { page-break-after: always; }
  .cert-page:last-child { page-break-after: auto; }
</style>
</head>
<body>
{% for report in reports %}
  {% set data = report.data or {} %}
  <div class="cert-page">
    {% include "inspections/_certificate_form9_body.html" %}
  </div>
{% endfor %}
</body>
</html>
