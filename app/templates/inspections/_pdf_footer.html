{# Letterhead footer. height must equal the `margin.bottom` passed to
   page.pdf() in pdf_worker.py (20mm) so the box sits flush to the
   bottom edge. pageNumber/totalPages are Playwright's built-in
   placeholder classes -- keep the names as-is. #}
<div style="width:100%; height:20mm; box-sizing:border-box; display:flex; align-items:flex-end; font-family:Arial,Helvetica,sans-serif;">
  <div style="width:100%; margin:0 5mm 5mm 5mm; border:1px solid #000; border-top:none; padding:2mm 4mm; text-align:center; box-sizing:border-box;">
    <span style="font-size:9px; color:#808080;">Page <span class="pageNumber"></span> of <span class="totalPages"></span></span>
  </div>
</div>
