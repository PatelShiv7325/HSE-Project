{% extends "base.html" %}
{% block breadcrumb_parent %}Companies{% endblock %}
{% block breadcrumb_title %}{{ 'Edit' if company else 'New' }} Company{% endblock %}
{% block content %}
<div class="card">
  <div class="toolbar">
    <h4 style="margin:0;">{{ 'Edit Company' if company else 'New Company' }}</h4>
    <a href="{{ url_for('companies.list_companies') }}" class="btn btn-outline">Back to List</a>
  </div>

  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:14px; margin-bottom:20px;">
      <div>
        <label style="display:block; margin-bottom:3px;">Company Name *</label>
        <input type="text" name="name" required value="{{ company.name if company else '' }}">
      </div>
      <div>
        <label style="display:block; margin-bottom:3px;">Occupier Name</label>
        <input type="text" name="occupier_name" value="{{ company.occupier_name if company else '' }}">
      </div>
      <div style="grid-column:span 2;">
        <label style="display:block; margin-bottom:3px;">Address</label>
        <input type="text" name="address" value="{{ company.address if company else '' }}">
      </div>
      <div>
        <label style="display:block; margin-bottom:3px;">Registration No.</label>
        <input type="text" name="registration_no" value="{{ company.registration_no if company else '' }}">
      </div>
      <div>
        <label style="display:block; margin-bottom:3px;">License No.</label>
        <input type="text" name="license_no" value="{{ company.license_no if company else '' }}">
      </div>
      <div>
        <label style="display:block; margin-bottom:3px;">Company Code / ID</label>
        <input type="text" name="company_code" value="{{ company.company_code if company else '' }}">
      </div>
    </div>

    <button type="submit" class="btn btn-primary">{{ 'Save Changes' if company else 'Create Company' }}</button>
  </form>
</div>
{% endblock %}
